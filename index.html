<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BOB - 오늘의 메뉴</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --accent: #1d1d1f; --main-text: #1d1d1f; --sub-text: #86868b;
            --card-bg: #ffffff; --body-bg: #f5f5f7; --modal-overlay: rgba(0, 0, 0, 0.4); --blue: #007aff;
            --ach-off: #d2d2d7; --ach-on: #1d1d1f; --danger: #ff3b30; --line: rgba(0,0,0,0.08);
            --gold-gradient: linear-gradient(145deg, #ffffff, #fffcf0);
            --gold-glow: 0 10px 40px rgba(212, 175, 55, 0.15);
            --diamond-grad: linear-gradient(135deg, #b9f2ff 0%, #ffffff 50%, #ffd1ff 100%);
            --legendary-shadow: 0 0 30px rgba(185, 242, 255, 0.6);
        }
        body.dark-mode {
            --main-text: #f5f5f7; --sub-text: #a1a1a6;
            --card-bg: #1c1c1e; --body-bg: #000000; --modal-overlay: rgba(0, 0, 0, 0.6);
            --ach-off: #3a3a3c; --ach-on: #ffffff; --line: rgba(255,255,255,0.1);
            --gold-gradient: linear-gradient(145deg, #1c1c1e, #2c2514);
            /* 다크 레전더리 전용 변수 */
            --legendary-dark-grad: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #581c87 100%);
            --legendary-dark-glow: 0 0 50px rgba(139, 92, 246, 0.3);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            margin: 0; background: var(--body-bg); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            letter-spacing: -0.02em; overflow: hidden; touch-action: manipulation;
            transition: background 0.3s; color: var(--main-text);
        }

        .icon { 
            width: 22px; height: 22px; 
            stroke: currentColor; stroke-width: 2; 
            fill: none; stroke-linecap: round; stroke-linejoin: round; 
            flex-shrink: 0; display: inline-block; vertical-align: middle; 
        }
        
        #main-card.master-card { background: var(--gold-gradient) !important; box-shadow: var(--gold-glow) !important; border: 1px solid rgba(212, 175, 55, 0.2); }
        
        /* [기존] 레전더리 테마 (라이트 모드 기준) */
        #main-card.legendary-theme { 
            background: var(--diamond-grad) !important; 
            border: 2px solid #b9f2ff; 
            box-shadow: 0 0 50px rgba(185, 242, 255, 0.5) !important;
            color: #1d1d1f !important;
        }
        #main-card.legendary-theme .title { color: rgba(29, 29, 31, 0.6) !important; }
        #main-card.legendary-theme #comment { color: rgba(29, 29, 31, 0.7) !important; }
        #main-card.legendary-theme .item.selected { color: #1d1d1f !important; }
        #main-card.legendary-theme #share-btn { background: rgba(0,0,0,0.05); color: #1d1d1f; }

        /* [추가] 다크모드 전용 레전더리 테마 (Dark Legendary) */
        body.dark-mode #main-card.legendary-theme {
            background: var(--legendary-dark-grad) !important;
            border: 2px solid #8b5cf6;
            box-shadow: var(--legendary-dark-glow) !important;
            color: #ffffff !important;
        }
        body.dark-mode #main-card.legendary-theme .title { color: rgba(255, 255, 255, 0.6) !important; }
        body.dark-mode #main-card.legendary-theme #comment { color: rgba(255, 255, 255, 0.8) !important; }
        body.dark-mode #main-card.legendary-theme .item.selected { color: #ffffff !important; }
        body.dark-mode #main-card.legendary-theme #share-btn { background: rgba(255,255,255,0.1); color: #ffffff; }
        body.dark-mode #main-card.legendary-theme #spin-btn { background: #ffffff; color: #1e1b4b; }
        
        .rank-avatar-wrapper { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: 12px; border-radius: 50%; border: 1px solid var(--line); font-size: 22px; }
        .border-master { border: 2px solid #d4af37 !important; box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); background: white; }
        .border-legendary { border: 2px solid #b9f2ff !important; box-shadow: 0 0 15px rgba(185, 242, 255, 0.8); background: var(--diamond-grad); animation: diamond-glow 2s infinite alternate; }
        
        /* 다크모드 랭킹 보더 보정 */
        body.dark-mode .border-legendary { border-color: #8b5cf6 !important; background: var(--legendary-dark-grad); box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }

        @keyframes diamond-glow {
            from { box-shadow: 0 0 5px rgba(185, 242, 255, 0.5); }
            to { box-shadow: 0 0 15px rgba(185, 242, 255, 0.9); }
        }

        .master-crown { font-size: 9px; vertical-align: super; color: #d4af37; margin-left: 2px; font-weight: 800; }
        .legend-star { color: #00c2ff; text-shadow: 0 0 10px rgba(0,194,255,0.5); }
        .original-badge { background: #d4af37 !important; color: #fff !important; }
        #main-card.legendary-card { border: 2px solid #b9f2ff; box-shadow: var(--legendary-shadow) !important; }
        .legendary-badge { background: var(--diamond-grad) !important; color: #1d1d1f !important; border: 1px solid #b9f2ff; box-shadow: 0 2px 10px rgba(185,242,255,0.3); }
        
        #menu-trigger { position: absolute; top: 20px; left: 20px; width: 44px; height: 44px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 1100; color: var(--main-text); }
        #sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: var(--card-bg); z-index: 1050; transition: 0.4s cubic-bezier(0.15, 0, 0.15, 1); box-shadow: 10px 0 30px rgba(0,0,0,0.05); padding: 60px 20px 30px 20px; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .sidebar-progress { padding: 20px 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--sub-text); margin-bottom: 8px; }
        .progress-bg { width: 100%; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--blue); width: 0%; transition: 1s ease-out; }
        .nav-item { padding: 18px 10px; font-size: 15px; font-weight: 500; color: var(--main-text); border-bottom: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 12px; position: relative; }
        .nav-item.locked { opacity: 0.3; cursor: default; }

        #main-card { background: var(--card-bg); width: 320px; padding: 50px 25px 60px 25px; border-radius: 40px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.05); z-index: 10; transition: all 0.5s cubic-bezier(0.15, 0, 0.15, 1); position: relative; display: flex; flex-direction: column; align-items: center; }
        .title { font-size: 11px; font-weight: 700; color: var(--sub-text); margin-bottom: 25px; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; width: 100%; cursor: pointer; user-select: none; }
        #new-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-bottom: 10px; opacity: 0; transform: scale(0.5); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: inline-block; }
        #new-badge.show { opacity: 1; transform: scale(1); }
        .badge-new-style { background: var(--danger); color: #ffffff; }
        .window { height: 80px; width: 100%; overflow: hidden; position: relative; margin-bottom: 15px; mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent); }
        .reel { position: absolute; width: 100%; top: 0; }
        .item { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--ach-off); }
        .selected { color: var(--main-text) !important; }
        #comment { min-height: 48px; font-size: 14px; color: var(--sub-text); margin-bottom: 35px; opacity: 0; transition: 0.8s; display: flex; align-items: center; justify-content: center; line-height: 1.6; padding: 0 10px; word-break: keep-all; width: 100%; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button { border: none; border-radius: 22px; font-size: 16px; font-weight: 600; padding: 20px; cursor: pointer; transition: 0.3s; width: 100%; }
        #spin-btn { background: var(--main-text); color: var(--card-bg); }
        #spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #share-btn { background: #efeff4; color: var(--main-text); font-size: 15px; opacity: 0; pointer-events: none; }
        body.dark-mode #share-btn { background: #2c2c2e; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); display: none; justify-content: center; align-items: flex-end; z-index: 1200; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; height: 85vh; border-radius: 30px 30px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.15, 0, 0.15, 1); }
        .drag-zone { padding: 12px 0 20px 0; flex-shrink: 0; cursor: grab; }
        .modal-handle { width: 36px; height: 5px; background: var(--ach-off); border-radius: 3px; margin: 0 auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 0 25px; margin-bottom: 10px; position: relative; }
        #modal-title { flex: 1; text-align: center; margin-left: 35px; font-size: 20px; font-weight: 800; }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding: 0 30px 40px 30px; -webkit-overflow-scrolling: touch; color: var(--main-text); }
        .achievement-item { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); position: relative; }
        .ach-icon { font-size: 32px; margin-right: 15px; filter: grayscale(1); opacity: 0.2; flex-shrink: 0; }
        .unlocked .ach-icon { filter: grayscale(0); opacity: 1; }
        .ach-info { flex-grow: 1; }
        .ach-name { font-size: 15px; font-weight: 700; color: var(--main-text); }
        .ach-desc { font-size: 12px; color: var(--sub-text); line-height: 1.4; margin-top: 2px; }
        .ach-progress-text { position: absolute; right: 0; top: 18px; font-size: 11px; font-weight: 800; color: var(--sub-text); }
        
        .new-indicator { background: var(--danger); color: white; font-size: 9px; padding: 2px 5px; border-radius: 5px; font-weight: 800; position: absolute; top: 50%; right: 15px; transform: translateY(-50%); }
        .ach-new-indicator { background: var(--danger); color: white; font-size: 9px; padding: 2px 4px; border-radius: 4px; font-weight: 800; margin-left: 6px; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); }
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 600; z-index: 2000; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: nowrap; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .switch { position: relative; display: inline-block; width: 51px; height: 31px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e9e9eb; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(20px); }
        .danger-btn { color: var(--danger); font-weight: 600; cursor: pointer; border: 1px solid var(--danger); padding: 8px 16px; border-radius: 10px; font-size: 13px; }
        .custom-input { width: 100%; border: 1px solid var(--line); background: var(--body-bg); color: var(--main-text); padding: 12px; border-radius: 12px; font-size: 14px; margin-top: 10px; }
        .admin-section { margin-bottom: 30px; padding: 15px; background: rgba(0,0,0,0.03); border-radius: 20px; }
        .admin-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; opacity: 0.6; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .admin-btn { padding: 12px; font-size: 12px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 10px; color: var(--main-text); font-weight: 600; cursor: pointer; }
        .admin-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-bg); color: var(--main-text); font-size: 14px; }
        #receipt-capture { position: fixed; left: -9999px; width: 350px; background: white; padding: 40px 30px; color: #1d1d1f; font-family: 'Courier New', Courier, monospace; }
        .receipt-line { border-top: 1px dashed #000; margin: 15px 0; }
        .receipt-header { text-align: center; font-weight: 800; font-size: 20px; margin-bottom: 5px; }
        .receipt-item { display: flex; justify-content: space-between; margin: 10px 0; }
        .stat-card { background: rgba(0,122,255,0.05); padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--line); }
        .stat-value { font-size: 24px; font-weight: 800; color: var(--blue); }
        .stat-label { font-size: 12px; color: var(--sub-text); margin-top: 4px; }
        
        .rank-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 15px; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.2s; }
        .rank-row:active { background: rgba(0,0,0,0.05); }
        .rank-me { background: rgba(0,122,255,0.08) !important; border-radius: 18px; margin: 4px 0; border-bottom: none !important; }
        .rank-number { font-weight: 400; width: 35px; font-size: 16px; color: var(--sub-text); }
        .rank-1 .rank-number, .rank-2 .rank-number, .rank-3 .rank-number { font-weight: 800; }
        .rank-1 .rank-number { color: #FFD700; }
        .rank-2 .rank-number { color: #C0C0C0; }
        .rank-3 .rank-number { color: #CD7F32; }
        .rank-name-box { display: flex; flex-direction: column; flex-grow: 1; }
        .rank-name { font-weight: 400; font-size: 15px; }
        .rank-bio { font-size: 11px; color: var(--sub-text); margin-top: 2px; }
        .rank-value { font-weight: 400; font-size: 14px; color: var(--main-text); text-align: right; display: flex; flex-direction: column; }
        .rank-time { font-size: 10px; color: var(--sub-text); margin-top: 2px; font-weight: 400; }
        .rank-ach-count { font-size: 10px; color: var(--blue); font-weight: 700; margin-top: 1px; }

        .like-btn-simple { 
            background: none; border: none; padding: 10px; 
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: 0.2s; width: auto;
        }
        .like-btn-simple:active { transform: scale(1.2); }
        .like-btn-simple:disabled { opacity: 0.5; filter: grayscale(1); }
        .like-heart { font-size: 40px; }
        .like-count-simple { font-size: 16px; font-weight: 800; color: var(--main-text); }
        
        .login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1px solid var(--line); padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; color: #1d1d1f; width: 100%; }
        .login-btn img { width: 18px; }

        .profile-setup { display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
        .avatar-circle { width: 80px; height: 80px; border-radius: 40px; background: var(--body-bg); display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 15px; border: 2px solid var(--line); transition: 0.3s; position: relative; }
        .emoji-picker-container { width: 100%; background: var(--body-bg); border-radius: 20px; padding: 15px; margin-top: 10px; border: 1px solid var(--line); }
        .emoji-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .emoji-grid.collapsed .emoji-option:nth-child(n+9) { display: none; }
        .emoji-option { font-size: 24px; padding: 8px; text-align: center; cursor: pointer; border-radius: 12px; transition: 0.2s; }
        .emoji-option:hover { background: var(--card-bg); transform: scale(1.1); }
        .emoji-option.selected-emoji { background: var(--blue); }
        .more-emojis-btn { width: 100%; margin-top: 10px; padding: 8px; font-size: 12px; color: var(--blue); font-weight: 700; text-align: center; cursor: pointer; }
        .save-profile-btn { margin-top: 15px; background: var(--blue); color: white; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; width: 100%; text-align: center; cursor: pointer; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.03); border-radius: 12px; }
        .prob-text { font-size: 10px; color: #8e8e93; font-weight: 600; margin-left: 5px; }
        
        .like-log-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; background: rgba(0,0,0,0.02); border-radius: 12px; margin-bottom: 8px; }
        .like-log-user { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
        .like-log-count { font-weight: 800; color: var(--danger); font-size: 13px; }
    </style>
</head>
<body>
    <div id="toast">🏆 업적 달성!</div>
    <div id="menu-trigger" onclick="toggleSidebar()">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
    </div>
    <div id="sidebar-overlay" onclick="toggleSidebar()" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1040; display:none;"></div>
    
    <div id="sidebar">
        <div class="sidebar-progress">
            <div class="progress-label"><span>수집 진행도</span><span id="side-rate-text">0/0</span></div>
            <div class="progress-bg"><div id="side-progress-fill" class="progress-fill"></div></div>
        </div>
        <div class="nav-item" onclick="openModal('menuList'); toggleSidebar();">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg> 수집 현황
        </div>
        <div class="nav-item" onclick="openModal('achievement'); toggleSidebar();">
            <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> 업적
            <span id="nav-ach-new" class="new-indicator" style="display:none;">N</span>
        </div>
        <div class="nav-item" onclick="openModal('ranking'); toggleSidebar();">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"></path></svg> 글로벌 랭킹
        </div>
        <div class="nav-item" id="nav-stats" onclick="handleStatsClick()">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg> 통계 <span id="stats-lock">🔒</span>
        </div>
        <div class="nav-item" onclick="openModal('history'); toggleSidebar();">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> 히스토리
        </div>
        <div class="nav-item" onclick="openModal('settings'); toggleSidebar();">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg> 설정
        </div>
    </div>
    
    <div id="main-card">
        <div class="title" id="main-title-text" onclick="handleTitleClick()">B O B</div>
        <div id="new-badge">NEW</div>
        <div class="window"><div id="reel" class="reel"></div></div>
        <div id="comment"></div>
        <div class="btn-group" id="card-btns">
            <button id="spin-btn" onclick="spin()">메뉴 뽑기</button>
            <button id="share-btn" onclick="shareNow()">공유하기</button>
        </div>
    </div>

    <div id="receipt-capture">
        <div class="receipt-header">GOURMET RECEIPT</div>
        <div style="text-align:center; font-size:10px; margin-bottom:15px;">Selection by BOB Algorithm</div>
        <div class="receipt-line"></div>
        <div class="receipt-item"><span>DATE:</span><span id="rec-date"></span></div>
        <div class="receipt-item"><span>TIME:</span><span id="rec-time"></span></div>
        <div class="receipt-line"></div>
        <div style="font-size:24px; font-weight:800; text-align:center; margin:30px 0;" id="rec-menu"></div>
        <div style="text-align:center; font-size:11px; color:#555; line-height:1.6;" id="rec-comment"></div>
        <div class="receipt-line"></div>

    <div id="modal-overlay" onclick="closeModal()">
        <div class="modal-content" id="main-modal" onclick="event.stopPropagation()">
            <div class="drag-zone" id="dragZone"><div class="modal-handle"></div></div>
            <div class="modal-header"><h2 id="modal-title">제목</h2><span id="modal-close-btn" style="color:var(--blue); font-weight:700; cursor:pointer;" onclick="closeModal()">닫기</span></div>
            <div class="scroll-area" id="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs, serverTimestamp, deleteDoc, where, increment, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, linkWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBobeMrivkAB0B6M3XLofHmq9lW6I_EfaY",
            authDomain: "bobserver-d2331.firebaseapp.com",
            projectId: "bobserver-d2331",
            storageBucket: "bobserver-d2331.firebasestorage.app",
            messagingSenderId: "287949923996",
            appId: "1:287949923996:web:74f14121a919071b042f59"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.firebaseDB = db;
        window.firebaseAuth = auth;

        // 시간 변환 헬퍼 함수
        function formatRelativeTime(timestamp) {
            if (!timestamp) return "";
            const now = new Date();
            const date = timestamp.toDate();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return "방금 전";
            if (diff < 3600) return Math.floor(diff / 60) + "분 전";
            if (diff < 86400) return Math.floor(diff / 3600) + "시간 전";
            if (diff < 604800) return Math.floor(diff / 86400) + "일 전";
            return date.toLocaleDateString();
        }

        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    const serverData = userSnap.data();
                    window.stats = {
                        ...window.stats,
                        total: serverData.totalSpins || 0,
                        nickname: serverData.nickname || "미식가",
                        avatar: serverData.avatar || "😋",
                        bio: serverData.bio || "글로벌 미식가",
                        collected: serverData.collected || [],
                        achievements: serverData.achievements || [],
                        counts: serverData.counts || {},
                        streak: serverData.streak || 1,
                        history: serverData.history || []
                    };
                    localStorage.setItem('bob_v1', JSON.stringify(window.stats));
                }
                location.reload();
            } catch (e) {
                console.error(e);
                alert("로그인 중 오류가 발생했습니다.");
            }
        };

        window.logoutFromGoogle = async function() {
            if (confirm('로그아웃 하시겠습니까? 로그아웃 시 현재 브라우저의 기록이 초기화됩니다.')) {
                try {
                    await signOut(auth);
                    localStorage.removeItem('bob_v1');
                    location.reload();
                } catch (e) {
                    alert("로그아웃 중 오류가 발생했습니다.");
                }
            }
        };

        async function syncWithServer(user) {
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        nickname: window.stats.nickname,
                        avatar: window.stats.avatar,
                        bio: window.stats.bio,
                        totalSpins: window.stats.total,
                        collected: window.stats.collected,
                        achievements: window.stats.achievements,
                        counts: window.stats.counts,
                        streak: window.stats.streak,
                        history: window.stats.history || [],
                        likes: 0,
                        lastActive: serverTimestamp()
                    });
                } else {
                    const serverData = userSnap.data();
                    if (window.stats.total > (serverData.totalSpins || 0)) {
                        await updateDoc(userRef, {
                            totalSpins: window.stats.total,
                            collected: window.stats.collected,
                            achievements: window.stats.achievements,
                            counts: window.stats.counts,
                            history: window.stats.history || [],
                            lastActive: serverTimestamp()
                        });
                    } else {
                        window.stats.total = serverData.totalSpins || 0;
                        window.stats.nickname = serverData.nickname || "미식가";
                        window.stats.avatar = serverData.avatar || "😋";
                        window.stats.bio = serverData.bio || "글로벌 미식가";
                        window.stats.collected = serverData.collected || [];
                        window.stats.achievements = serverData.achievements || [];
                        window.stats.counts = serverData.counts || {};
                        window.stats.history = serverData.history || [];
                        window.stats.streak = serverData.streak || 1;
                        localStorage.setItem('bob_v1', JSON.stringify(window.stats));
                    }
                }
                window.isSyncReady = true;
                if (typeof checkMaster === "function") {
                    checkMaster(); updateSidebarProgress(); updateStatsLock(); checkNewAchBadge();
                }
            } catch (e) {
                console.error("Sync Error:", e);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) { 
                syncWithServer(user); 
            } else if (!user) {
                signInAnonymously(auth);
            }
        });

        window.pushSpinToServer = async function() {
            if (!auth.currentUser || auth.currentUser.isAnonymous || !window.isSyncReady) return;
            try {
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, {
                    totalSpins: window.stats.total,
                    collected: window.stats.collected,
                    achievements: window.stats.achievements,
                    counts: window.stats.counts,
                    history: window.stats.history || [],
                    lastActive: serverTimestamp()
                });
            } catch(e) { console.error("Update Error:", e); }
        };

        window.updateProfileOnServer = async function() {
            if (!auth.currentUser || auth.currentUser.isAnonymous || !window.isSyncReady) return;
            const userRef = doc(db, "users", auth.currentUser.uid);
            await updateDoc(userRef, {
                nickname: window.stats.nickname,
                avatar: window.stats.avatar,
                bio: window.stats.bio,
                lastActive: serverTimestamp()
            });
        };

        window.getGlobalRanking = async function() {
            try {
                const q = query(collection(db, "users"), orderBy("totalSpins", "desc"), limit(15));
                const snap = await getDocs(q);
                let html = "";
                let rank = 1;
                const totalAchCount = (window.achievementsList || []).length;

                snap.forEach(d => {
                    const data = d.data();
                    const isMe = auth.currentUser && d.id === auth.currentUser.uid;
                    const coll = data.collected || [];
                    const achs = data.achievements || [];
                    const isLegendMaster = (window.allLegendMenus || []).every(m => coll.includes(m));
                    const isCommonMaster = coll.filter(m => window.allCommonMenus && window.allCommonMenus.hasOwnProperty(m)).length >= (window.menusList ? window.menusList.length : 0);

                    let borderClass = "";
                    if(isLegendMaster) borderClass = "border-legendary";
                    else if(isCommonMaster) borderClass = "border-master";

                    let rankIcon = rank;
                    if(rank === 1) rankIcon = "🥇";
                    else if(rank === 2) rankIcon = "🥈";
                    else if(rank === 3) rankIcon = "🥉";

                    const activeTime = formatRelativeTime(data.lastActive);

                    html += `
                        <div class="rank-row rank-${rank} ${isMe ? 'rank-me' : ''}" onclick="window.showPlayerDetail('${d.id}')">
                            <span class="rank-number">${rankIcon}</span>
                            <div class="rank-avatar-wrapper ${borderClass}">${data.avatar || '👤'}</div>
                            <div class="rank-name-box">
                                <span class="rank-name">${data.nickname || '익명'} ${isMe ? '<span style="color:var(--blue); font-weight:800; margin-left:4px;">(나)</span>' : ''}</span>
                                <div style="display:flex; gap:8px;">
                                    <div class="rank-ach-count">업적: ${achs.length}/${totalAchCount}</div>
                                    <div class="rank-ach-count" style="color:#ff3b30;">❤️ ${data.likes || 0}</div>
                                </div>
                            </div>
                            <div class="rank-value">
                                <div>${data.totalSpins || 0}회</div>
                                <span class="rank-time">${activeTime}</span>
                            </div>
                        </div>`;
                    rank++;
                });
                return html || "<div style='text-align:center; padding:20px;'>랭킹 정보가 없습니다.</div>";
            } catch (e) {
                console.error(e);
                return "<div style='text-align:center; padding:20px;'>랭킹을 불러올 수 없습니다.</div>";
            }
        };

        window.handleLike = async function(targetUid) {
            const user = auth.currentUser;
            if (!user || user.isAnonymous) return alert("좋아요를 누르려면 로그인이 필요합니다.");
            if (user.uid === targetUid) return alert("본인에게는 좋아요를 누를 수 없습니다.");

            const likeBtn = document.getElementById('like-action-btn');
            const todayStr = new Date().toDateString();

            try {
                const q = query(collection(db, "likeLogs"), where("from", "==", user.uid));
                const logSnap = await getDocs(q);
                const todayLogs = logSnap.docs.filter(doc => {
                    const data = doc.data();
                    return data.createdAt && data.createdAt.toDate().toDateString() === todayStr;
                });

                if (todayLogs.length >= 10) {
                    alert("오늘은 더 이상 좋아요를 보낼 수 없습니다. (하루 10회 제한)");
                    return;
                }

                likeBtn.style.pointerEvents = 'none';

                await addDoc(collection(db, "likeLogs"), {
                    from: user.uid,
                    fromName: window.stats.nickname,
                    fromAvatar: window.stats.avatar,
                    to: targetUid,
                    createdAt: serverTimestamp()
                });

                await updateDoc(doc(db, "users", targetUid), {
                    likes: increment(1)
                });

                confetti({ particleCount: 40, spread: 70, origin: { y: 0.8 }, colors: ['#ff3b30', '#ffffff'] });
                const updatedVal = document.getElementById('detail-like-val');
                if(updatedVal) updatedVal.innerText = parseInt(updatedVal.innerText) + 1;
                
            } catch (e) {
                console.error("Like Error:", e);
                alert("좋아요 처리 중 오류가 발생했습니다.");
            } finally {
                likeBtn.style.pointerEvents = 'auto';
            }
        };

        window.showPlayerDetail = async function(uid) {
            const body = document.getElementById('modal-body');
            const title = document.getElementById('modal-title');
            const closeBtn = document.getElementById('modal-close-btn');
            
            title.innerText = "프로필 정보";
            closeBtn.onclick = () => openModal('ranking');
            
            body.innerHTML = "<div style='text-align:center; padding:50px;'>정보를 불러오는 중...</div>";

            try {
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    const collCount = (data.collected || []).length;
                    const unlockedAchs = data.achievements || [];
                    const isMe = auth.currentUser && uid === auth.currentUser.uid;
                    const achList = window.achievementsList || [];
                    
                    let achHtml = achList.map(a => {
                        const isUnlocked = unlockedAchs.includes(a.id);
                        const displayName = (a.hidden && !isUnlocked) ? "???" : a.name;
                        return `<div style="text-align:center; opacity:${isUnlocked ? '1' : '0.2'};"><div style="font-size:24px;">${a.icon}</div><div style="font-size:9px; font-weight:700;">${displayName}</div></div>`;
                    }).join('');

                    let likeLogsHtml = "";
                    try {
                        const logQ = query(collection(db, "likeLogs"), where("to", "==", uid), orderBy("createdAt", "desc"), limit(30));
                        const logsSnap = await getDocs(logQ);
                        
                        if (!logsSnap.empty) {
                            const aggregated = {};
                            logsSnap.forEach(ld => {
                                const ldData = ld.data();
                                const senderId = ldData.from;
                                const senderName = ldData.fromName || "익명 미식가";
                                const avatar = ldData.fromAvatar || "👤";
                                if(!aggregated[senderId]) aggregated[senderId] = {name: senderName, count: 0, av: avatar};
                                aggregated[senderId].count++;
                            });
                            
                            likeLogsHtml = `<div style="width:100%; margin-top:20px; text-align:left;">
                                <h3 style="font-size:14px; margin-bottom:12px;">응원 보낸 사람들 (최근 기록)</h3>
                                ${Object.keys(aggregated).map(id => `
                                    <div class="like-log-item">
                                        <div class="like-log-user"><span>${aggregated[id].av}</span> ${aggregated[id].name}</div>
                                        <div class="like-log-count">❤️ ${aggregated[id].count}개</div>
                                    </div>
                                `).join('')}
                            </div>`;
                        } else {
                            likeLogsHtml = `<div style="width:100%; margin-top:20px; text-align:center; color:var(--sub-text); font-size:13px;">아직 응원 기록이 없어요.</div>`;
                        }
                    } catch(logErr) { console.error("Log fetch error", logErr); }

                    body.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; padding:20px 0;">
                            <div class="avatar-circle" style="width:100px; height:100px; font-size:50px;">${data.avatar || '👤'}</div>
                            <h2 style="margin:15px 0 5px 0;">${data.nickname || '익명'}</h2>
                            <p style="color:var(--sub-text); margin-bottom:20px;">${data.bio || '미식가'}</p>
                            
                            <div style="margin-bottom:25px;">
                                <button id="like-action-btn" class="like-btn-simple" onclick="window.handleLike('${uid}')" ${isMe ? 'disabled' : ''}>
                                    <span class="like-heart">❤️</span>
                                    <span class="like-count-simple" id="detail-like-val">${data.likes || 0}</span>
                                </button>
                                ${!isMe ? '<p style="font-size:10px; color:var(--sub-text); margin-top:8px; text-align:center;">터치하여 응원하기</p>' : ''}
                            </div>

                            <div style="width:100%; display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:30px;">
                                <div class="stat-card" style="margin:0;"><div class="stat-value">${data.totalSpins || 0}회</div><div class="stat-label">총 추천</div></div>
                                <div class="stat-card" style="margin:0;"><div class="stat-value">${collCount}종</div><div class="stat-label">수집 메뉴</div></div>
                            </div>
                            <div style="width:100%; text-align:left;">
                                <h3 style="font-size:14px; margin-bottom:15px;">달성한 업적 (${unlockedAchs.length})</h3>
                                <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:15px; background:rgba(0,0,0,0.03); padding:20px; border-radius:20px;">${achHtml}</div>
                            </div>
                            ${likeLogsHtml}
                        </div>`;
                }
            } catch (e) { 
                console.error(e);
                body.innerHTML = "<div style='text-align:center; padding:50px;'>정보를 불러오는 중...</div>"; 
            }
        };

        window.fullReset = async function() {
            if (confirm('모든 기록을 초기화할까요? 서버 데이터도 삭제됩니다.')) {
                if (auth.currentUser && !auth.currentUser.isAnonymous) {
                    const userRef = doc(db, "users", auth.currentUser.uid);
                    await deleteDoc(userRef);
                }
                localStorage.removeItem('bob_v1');
                await signOut(auth);
                location.reload();
            }
        };
    </script>

        const STORAGE_KEY = 'bob_v1';
        let stats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        const defaultStats = { total: 0, nickname: "미식가", bio: "글로벌 미식가", avatar: "😋", collected: [], seen: [], achievements: [], unviewedAchievements: [], lastSpinTime: 0, lastMenu: "", lastVisit: "", streak: 1, categories: [], history: [], darkMode: false, counts: {}, customMenus: [], customDescriptions: {}, useReceipt: true, receiptShareCount: 0, isAdminMode: false, totalStayTime: 0, showProb: false };
        window.stats = { ...defaultStats, ...stats };

        const achievements = [
            { id: 'first', icon: '🐣', name: '첫 미식의 시작', desc: '첫 메뉴 추천을 받았습니다.', cond: s => s.total >= 1, goal: 1, current: s => s.total },
            { id: 'regular', icon: '🍚', name: '밥심의 달인', desc: '추천을 10번 받았습니다.', cond: s => s.total >= 10, goal: 10, current: s => s.total },
            { id: 'hesitation', icon: '🤔', name: '고민 중독', desc: '추천을 150번 받았습니다.', cond: s => s.total >= 150, goal: 150, current: s => s.total },    
            { id: 'gourmet', icon: '👨‍🍳', name: '준비된 미식가', desc: '서로 다른 메뉴 30개 수집.', cond: s => s.collected.length >= 30, goal: 30, current: s => s.collected.length },
            { id: 'flash', icon: '⚡️', name: '번개맨', desc: '0.1초 이내에 다시 뽑기.', cond: s => false, hidden: true },
            { id: 'destiny', icon: '🔗', name: '데스티니', desc: '연속으로 같은 결과 등장.', cond: s => false, hidden: true },
            { id: 'regular_guest', icon: '🏠', name: '단골 손님', desc: '3일 연속 BOB 방문.', cond: s => s.streak >= 3, goal: 3, current: s => s.streak },
            { id: 'diet', icon: '💀', name: '다이어트!', desc: '메뉴 뽑기에서 꽝 뽑기.', cond: s => false, hidden: true },
            { id: 'no_picky', icon: '🥗', name: '편식 금지', desc: '한, 중, 일, 양식 모두 수집.', cond: s => ['k','c','j','w'].every(c => (s.categories || []).includes(c)), goal: 4, current: s => {
                const cats = ['k','c','j','w'];
                return cats.filter(c => (s.categories || []).includes(c)).length;
            }},
            { id: 'owl', icon: '🦉', name: '야식 전문가', desc: '심야에 메뉴를 선정함.', cond: () => new Date().getHours() >= 22 || new Date().getHours() <= 2 },
            { id: 'receipt_review', icon: '📸', name: '리뷰 이벤트', desc: '메뉴 영수증을 공유했습니다.', cond: s => (s.receiptShareCount || 0) >= 1, goal: 1, current: s => s.receiptShareCount || 0 },
            { id: 'legend_discovery', icon: '✨', name: '전설의 목격자', desc: '전설 메뉴를 처음으로 발견했습니다.', cond: s => s.collected.some(m => legendMenus.includes(m)), hidden: true },
            { id: 'legend_collector', icon: '💎', name: '전설의 미식가', desc: '모든 전설 메뉴(7종) 수집 완료!', cond: s => legendMenus.every(m => s.collected.includes(m)), hidden: true },
            { id: 'master', icon: '🏆', name: '미식의 끝', desc: '모든 일반 메뉴 수집 완료!', cond: s => s.collected.filter(m => menus.includes(m)).length >= menus.length, goal: menus.length, current: s => s.collected.filter(m => menus.includes(m)).length }
        ];
        window.achievementsList = achievements;

        let toastQueue = []; let isToastShowing = false; let isMaster = false; let titleClickCount = 0; let titleClickTimer = null; let forcedMenu = null;
        let sessionStartTime = Date.now();

        function init() {
            if (window.stats.darkMode) document.body.classList.add('dark-mode');
            checkStreak(); checkMaster(); updateSidebarProgress(); updateStatsLock(); checkNewAchBadge();
            const reel = document.getElementById('reel');
            let displayMenus = [...menus, ...window.stats.customMenus, "꽝"]; 
            displayMenus.sort(() => Math.random() - 0.5); 
            reel.innerHTML = [...displayMenus, ...displayMenus, ...displayMenus].map(m => `<div class="item">${m}</div>`).join('');
            reel.style.transform = `translateY(-${displayMenus.length * 80}px)`;
            setupBottomSheet();
            setInterval(() => {
                let now = Date.now();
                let diff = Math.floor((now - sessionStartTime) / 1000);
                window.stats.totalStayTime += (diff > 0 ? diff : 0);
                sessionStartTime = now;
                save();
            }, 10000);
        }

        function checkNewAchBadge() {
            const badge = document.getElementById('nav-ach-new');
            if(window.stats.unviewedAchievements && window.stats.unviewedAchievements.length > 0) {
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h > 0 ? h + '시간 ' : ''}${m > 0 ? m + '분 ' : ''}${s}초`;
        }

        function handleTitleClick() {
            titleClickCount++; clearTimeout(titleClickTimer);
            titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 2000);
            if (titleClickCount === 9) { titleClickCount = 0; openModal('admin'); }
        }

        function checkMaster() {
            const commonTarget = menus.length;
            const isLegendCollected = legendMenus.every(m => window.stats.collected.includes(m));
            const card = document.getElementById('main-card');
            const titleText = document.getElementById('main-title-text');
            if (isLegendCollected) {
                card.classList.add('legendary-theme');
                titleText.innerHTML = 'B O B <span class="legend-star">✦</span>';
            } else if (window.stats.collected.filter(m => menus.includes(m)).length >= commonTarget) {
                isMaster = true; card.classList.add('master-card');
                titleText.innerHTML = 'B O B <span class="master-crown">✦</span>';
            } else {
                isMaster = false; card.classList.remove('master-card', 'legendary-theme');
                titleText.innerHTML = 'B O B';
            }
        }

        function updateStatsLock() {
            const isLegendCollected = legendMenus.every(m => window.stats.collected.includes(m));
            const lock = document.getElementById('stats-lock');
            const nav = document.getElementById('nav-stats');
            if (isLegendCollected) { lock.style.display = 'none'; nav.classList.remove('locked'); } 
            else { lock.style.display = 'inline'; nav.classList.add('locked'); }
        }

        function handleStatsClick() {
            const isLegendCollected = legendMenus.every(m => window.stats.collected.includes(m));
            if (isLegendCollected) { openModal('stats'); toggleSidebar(); }
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            const isOpen = sb.classList.toggle('open');
            ov.style.display = isOpen ? 'block' : 'none';
            if (isOpen) {
                checkNewAchBadge();
                updateSidebarProgress();
            }
        }

        function updateSidebarProgress() {
            const count = (window.stats.collected || []).length; 
            const total = menus.length + legendMenus.length;
            const rate = Math.round((count / total) * 100);
            const rateText = document.getElementById('side-rate-text');
            if(rateText) rateText.innerText = `${count} / ${total}`;
            const fill = document.getElementById('side-progress-fill');
            if(fill) fill.style.width = `${Math.min(rate, 100)}%`;
        }

        function spin() {
            const btn = document.getElementById('spin-btn'); 
            const newBadge = document.getElementById('new-badge');
            const card = document.getElementById('main-card');
            if(btn.disabled) return;
            document.querySelectorAll('.item').forEach(i => i.classList.remove('selected'));
            const now = Date.now();
            if (window.stats.lastSpinTime && (now - window.stats.lastSpinTime < 150)) unlock('flash');
            btn.disabled = true; 
            newBadge.classList.remove('show', 'original-badge', 'legendary-badge', 'badge-new-style');
            card.classList.remove('legendary-card');
            document.getElementById('share-btn').style.opacity = '0';
            document.getElementById('comment').style.opacity = '0';
            
            let basePool = [...menus, ...window.stats.customMenus, "꽝"];
            let finalMenu = "";
            let isLegendResult = false;

            if (forcedMenu) { finalMenu = forcedMenu; forcedMenu = null; } 
            else {
                let selectionPool = [...basePool, "LEGEND_GROUP"];
                let picked = selectionPool[Math.floor(Math.random() * selectionPool.length)];
                if (picked === "LEGEND_GROUP") {
                    if (Math.random() < 0.3) {
                        finalMenu = legendMenus[Math.floor(Math.random() * legendMenus.length)];
                        isLegendResult = true;
                    } else finalMenu = menus[Math.floor(Math.random() * menus.length)];
                } else finalMenu = picked;
            }
            if (legendMenus.includes(finalMenu)) isLegendResult = true;

            let displayMenus = [...basePool].sort(() => Math.random() - 0.5);
            if (!displayMenus.includes(finalMenu)) displayMenus.push(finalMenu);
            displayMenus.sort(() => Math.random() - 0.5);
            const reel = document.getElementById('reel');
            reel.innerHTML = [...displayMenus, ...displayMenus, ...displayMenus].map(m => `<div class="item">${m}</div>`).join('');
            let idx = displayMenus.indexOf(finalMenu);
            const targetIdx = (displayMenus.length * 2) + idx;
            reel.style.transition = 'none';
            reel.style.transform = `translateY(-${displayMenus.length * 80}px)`;
            void reel.offsetHeight; 
            const duration = 3;
            reel.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.8, 0.1, 1)`;
            reel.style.transform = `translateY(-${targetIdx * 80}px)`;

            setTimeout(() => {
                const items = document.querySelectorAll('.item');
                if (items[targetIdx]) items[targetIdx].classList.add('selected');
                const historyDate = new Date().toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                if (finalMenu === window.stats.lastMenu) unlock('destiny');

                if (finalMenu === "꽝") {
                    document.getElementById('comment').innerText = "오늘은 다이어트인가요? 가끔은 비우는 것도 방법이죠.";
                    window.stats.total++; window.stats.history.unshift({ menu: "꽝", date: historyDate }); unlock('diet');
                } else if (window.stats.customMenus.includes(finalMenu)) {
                    document.getElementById('comment').innerText = window.stats.customDescriptions[finalMenu] || "당신이 창조한 특별한 미식의 순간입니다.";
                    newBadge.innerText = "ORIGINAL"; newBadge.classList.add('original-badge', 'show');
                    confetti({ particleCount: 60, spread: 100, origin: { y: 0.7 }, colors: ['#d4af37', '#ffffff'] });
                    window.stats.total++; window.stats.history.unshift({ menu: finalMenu, date: historyDate });
                } else {
                    const isNew = !window.stats.collected.includes(finalMenu);
                    updateStats(finalMenu);
                    document.getElementById('comment').innerText = menuData[finalMenu][0];
                    if (isLegendResult) {
                        newBadge.innerText = "LEGENDARY"; newBadge.classList.add('legendary-badge', 'show');
                        card.classList.add('legendary-card'); fireLegendaryFireworks(); unlock('legend_discovery');
                    } else if (isNew) {
                        newBadge.innerText = "NEW"; newBadge.classList.add('badge-new-style', 'show');
                        confetti({ particleCount: 50, spread: 80, origin: { y: 0.7 }, colors: ['#ff3b30', '#ffffff'] });
                    } else confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } }); 
                }
                
                document.getElementById('comment').style.opacity = '1';
                document.getElementById('share-btn').style.opacity = '1'; 
                document.getElementById('share-btn').style.pointerEvents = 'auto';
                
                if (isLegendResult) {
                    btn.innerText = "메뉴 뽑기";
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = "메뉴 뽑기";
                    }, 3000);
                } else {
                    btn.disabled = false;
                }

                window.stats.lastMenu = finalMenu; 
                window.stats.lastSpinTime = Date.now(); 
                save(); 
                updateStatsLock();
                if (window.pushSpinToServer) window.pushSpinToServer();
            }, duration * 1000);
        }

        function fireLegendaryFireworks() {
            const end = Date.now() + 3000;
            const colors = ['#b9f2ff', '#ffffff', '#ffd1ff'];
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function updateStats(m) {
            window.stats.total++; 
            if (!window.stats.collected.includes(m)) window.stats.collected.push(m);
            window.stats.counts[m] = (window.stats.counts[m] || 0) + 1;
            const cat = menuData[m][1]; 
            if (cat !== 'L' && !window.stats.categories.includes(cat)) window.stats.categories.push(cat);
            window.stats.history.unshift({ menu: m, date: new Date().toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) });
            if (window.stats.history.length > 30) window.stats.history.pop();
            checkAchievements(); checkMaster(); save(); updateSidebarProgress();
        }

        function checkAchievements() {
            achievements.forEach(a => { if (!window.stats.achievements.includes(a.id) && a.cond && a.cond(window.stats)) unlock(a.id); });
        }

        function unlock(id) { 
            if (!window.stats.achievements.includes(id)) { 
                const a = achievements.find(x => x.id === id);
                toastQueue.push(`🏆 업적 달성! ${a.hidden ? "???" : a.name}`);
                window.stats.achievements.push(id);
                if (!window.stats.unviewedAchievements) window.stats.unviewedAchievements = [];
                window.stats.unviewedAchievements.push(id);
                processToastQueue(); save(); checkNewAchBadge();
            } 
        }

        async function openModal(type) {
            const body = document.getElementById('modal-body'); 
            const title = document.getElementById('modal-title');
            const closeBtn = document.getElementById('modal-close-btn');
            
            closeBtn.onclick = closeModal;
            body.innerHTML = '';
            
            if (type === 'menuList') {
                title.innerText = '메뉴별 수집 현황';
                const collected = window.stats.collected || []; 
                const counts = window.stats.counts || {}; 
                const maxCount = Math.max(...Object.values(counts), 0);
                const allMenusToShow = [...menus, ...legendMenus];
                
                const probToggle = `<div class="toggle-row">
                    <span style="font-size:14px; font-weight:700;">추첨 확률 표시</span>
                    <label class="switch"><input type="checkbox" onchange="window.stats.showProb = this.checked; save(); openModal('menuList');" ${window.stats.showProb ? 'checked' : ''}><span class="slider"></span></label>
                </div>`;

                const totalSlots = (menus.length + window.stats.customMenus.length + 1) + 1;
                const commonProb = ((1 / totalSlots) * 100).toFixed(1);
                const legendTotalProb = (1 / totalSlots) * 0.3 * 100; 
                const legendProb = (legendTotalProb / legendMenus.length).toFixed(2);

                body.innerHTML = probToggle + allMenusToShow.map(m => {
                    const isLegend = legendMenus.includes(m);
                    const isCollected = collected.includes(m);
                    const c = counts[m] || 0; 
                    const isBest = c > 0 && c === maxCount;
                    const displayName = (isLegend && !isCollected) ? "???" : m;
                    const probDisplay = window.stats.showProb ? `<span class="prob-text">${isLegend ? legendProb : commonProb}%</span>` : "";
                    
                    return `<div class="menu-list-item" style="display:flex; justify-content:space-between; align-items:center; padding:15px 10px; border-bottom:1px solid var(--line); ${isBest ? 'background: rgba(0,122,255,0.05); border-radius:12px;' : ''}">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="${isLegend ? 'color:#00c2ff; font-weight:800;' : ''}">${isLegend ? '🌟 ' : ''}${displayName}</span>
                            ${probDisplay}
                            ${isBest ? '<span style="font-size:10px; background:var(--blue); color:white; padding:2px 6px; border-radius:4px; font-weight:800;">BEST</span>' : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="font-size:13px; color:var(--sub-text);">${c}회</span>
                            ${isCollected ? '<span style="color:var(--blue); font-weight:800;">✓</span>' : '<span style="color:var(--ach-off);">-</span>'}
                        </div>
                    </div>`;
                }).join('');
            } else if (type === 'achievement') {
                title.innerText = '나의 업적';
                body.innerHTML = achievements.map(a => {
                    const isUnlocked = window.stats.achievements.includes(a.id);
                    const isNew = window.stats.unviewedAchievements && window.stats.unviewedAchievements.includes(a.id);
                    let progText = (!isUnlocked && a.goal) ? `<span class="ach-progress-text">${a.current(window.stats)}/${a.goal}</span>` : "";
                    return `<div class="achievement-item ${isUnlocked ? 'unlocked' : ''}">
                        <div class="ach-icon">${a.icon}</div>
                        <div class="ach-info">
                            <div class="ach-name">${(a.hidden && !isUnlocked) ? '???' : a.name} ${isNew ? '<span class="ach-new-indicator">N</span>' : ''}</div>
                            <div class="ach-desc">${(a.hidden && !isUnlocked) ? '숨겨진 업적입니다.' : a.desc}</div>
                        </div>
                        ${progText}
                    </div>`;
                }).join('');
                window.stats.unviewedAchievements = []; save(); checkNewAchBadge();
            } else if (type === 'ranking') {
                title.innerText = '글로벌 리더보드';
                body.innerHTML = "<div style='text-align:center; padding:50px;'>기록을 가져오는 중...</div>";
                if (window.getGlobalRanking) { body.innerHTML = await window.getGlobalRanking(); }
            } else if (type === 'history') {
                title.innerText = '히스토리';
                body.innerHTML = window.stats.history.length ? window.stats.history.map(h => `<div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid var(--line);"><span>${h.menu}</span><span style="font-size:12px; color:var(--sub-text);">${h.date}</span></div>`).join('') : '<div style="text-align:center; padding:50px; color:var(--sub-text);">기록이 없습니다.</div>';
            } else if (type === 'stats') {
                title.innerText = '미식 상세 통계';
                const sortedCounts = Object.entries(window.stats.counts).sort((a,b) => b[1] - a[1]);
                const topMenu = sortedCounts[0] ? sortedCounts[0][0] : "없음";
                const legendFound = legendMenus.filter(m => window.stats.collected.includes(m)).length;
                body.innerHTML = `
                    <div class="stat-card"><div class="stat-value">${window.stats.total}회</div><div class="stat-label">총 추천 횟수</div></div>
                    <div class="stat-card"><div class="stat-value">${window.stats.collected.length}종</div><div class="stat-label">수집 메뉴</div></div>
                    <div class="stat-card"><div class="stat-value">${topMenu}</div><div class="stat-label">나의 최애 메뉴</div></div>
                    <div class="stat-card"><div class="stat-value">${legendFound} / ${legendMenus.length}</div><div class="stat-label">전설 메뉴 수집</div></div>
                    <div class="stat-card"><div class="stat-value">${window.stats.streak}일</div><div class="stat-label">연속 방문</div></div>
                    <div class="stat-card"><div class="stat-value">${formatTime(window.stats.totalStayTime)}</div><div class="stat-label">누적 접속</div></div>
                `;
            } else if (type === 'settings') {
                title.innerText = '설정';
                let masterSettings = isMaster ? `
                    <div style="margin-top:20px; padding:20px; background:var(--gold-gradient); border-radius:20px; border:1px solid rgba(212,175,55,0.2);">
                        <div style="font-size:13px; font-weight:800; color:#d4af37; margin-bottom:10px;">✦ 오리지널 메뉴 창조</div>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="custom-input" class="custom-input" placeholder="치킨, 오늘 밤 주인공" style="margin-top:0;">
                            <button onclick="addCustom()" style="width:80px; padding:0; border-radius:12px; background:var(--main-text); color:var(--card-bg); font-size:13px;">추가</button>
                        </div>
                        <div id="custom-tags" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:15px;">
                            ${window.stats.customMenus.map(m => `<span style="background:rgba(0,0,0,0.05); padding:5px 10px; border-radius:8px; font-size:12px; display:flex; align-items:center;">${m}<i style="margin-left:5px; cursor:pointer; font-style:normal;" onclick="removeCustom('${m}')">×</i></span>`).join('')}
                        </div>
                    </div>` : '';
                
                const gUser = window.firebaseAuth && window.firebaseAuth.currentUser;
                const isGoogle = gUser && !gUser.isAnonymous;

                body.innerHTML = `
                    <div class="profile-setup">
                        <div class="avatar-circle" id="current-avatar">${window.stats.avatar}</div>
                        <input type="text" id="nickname-input" class="custom-input" value="${window.stats.nickname}" placeholder="이름" maxlength="10">
                        <input type="text" id="bio-input" class="custom-input" value="${window.stats.bio}" placeholder="한 줄 설명" maxlength="20">
                        <div style="font-size:12px; color:var(--sub-text); margin:15px 0 5px 0; width:100%;">이모지 선택</div>
                        <div class="emoji-picker-container">
                            <div class="emoji-grid collapsed" id="emoji-grid">
                                ${emojiList.map(e => `<div class="emoji-option ${window.stats.avatar === e ? 'selected-emoji' : ''}" onclick="selectEmoji('${e}', this)">${e}</div>`).join('')}
                            </div>
                            <div class="more-emojis-btn" id="emoji-more-btn" onclick="toggleEmojiPicker()">더 보기 ▾</div>
                        </div>
                        <div class="save-profile-btn" onclick="saveProfile()">저장 및 적용</div>
                    </div>
                    <div class="admin-section">
                        <div class="admin-title">계정 연동</div>
                        ${isGoogle ? 
                        `<div style="font-size:14px; color:var(--blue); font-weight:700; margin-bottom:5px;">연결된 계정:</div>
                         <div style="font-size:12px; color:var(--sub-text); margin-bottom:15px;">${gUser.email}</div>
                         <button class="login-btn" style="background:#f5f5f7; color:#ff3b30; border:none;" onclick="window.logoutFromGoogle()">로그아웃</button>` : 
                        '<button class="login-btn" onclick="window.loginWithGoogle()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Google 로그인</button>'}
                    </div>
                    <div class="setting-row"><span>다크 모드</span><label class="switch"><input type="checkbox" id="dark-toggle" ${window.stats.darkMode ? 'checked' : ''} onchange="toggleDarkMode()"><span class="slider"></span></label></div>
                    <div class="setting-row"><span>영수증 공유</span><label class="switch"><input type="checkbox" id="receipt-toggle" ${window.stats.useReceipt ? 'checked' : ''} onchange="window.stats.useReceipt = this.checked; save();"><span class="slider"></span></label></div>
                    <div class="setting-row"><span>데이터 초기화</span><div class="danger-btn" onclick="window.fullReset()">초기화</div></div>
                    ${masterSettings}
                `;
            } else if (type === 'admin') {
                title.innerText = '관리자 모드';
                body.innerHTML = `
                    <div class="setting-row"><span>관리자 모드</span><label class="switch"><input type="checkbox" id="admin-toggle" ${window.stats.isAdminMode ? 'checked' : ''} onchange="window.stats.isAdminMode = this.checked; save();"><span class="slider"></span></label></div>
                    <div class="admin-section"><div class="admin-title">업적 관리</div><div class="admin-grid"><button class="admin-btn" onclick="adminAllAchievements()">전체 해금</button><button class="admin-btn" onclick="adminResetAchievements()">초기화</button></div></div>
                    <div class="admin-section"><div class="admin-title">뽑기 조작</div><select class="admin-select" id="admin-menu-select" onchange="forcedMenu = this.value || null;"><option value="">랜덤</option><option value="꽝">꽝</option>${[...menus, ...legendMenus].map(m => `<option value="${m}">${m}</option>`).join('')}</select></div>
                `;
            }
            document.getElementById('modal-overlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('main-modal').style.transform = 'translateY(0)'; }, 10);
        }

        window.toggleEmojiPicker = function() {
            const grid = document.getElementById('emoji-grid');
            const btn = document.getElementById('emoji-more-btn');
            if(grid.classList.contains('collapsed')) { grid.classList.remove('collapsed'); btn.innerText = "접기 ▴"; } 
            else { grid.classList.add('collapsed'); btn.innerText = "더 보기 ▾"; }
        };

        window.selectEmoji = function(emoji, el) {
            document.querySelectorAll('.emoji-option').forEach(opt => opt.classList.remove('selected-emoji'));
            el.classList.add('selected-emoji');
            document.getElementById('current-avatar').innerText = emoji;
        };

        window.saveProfile = async function() {
            const newName = document.getElementById('nickname-input').value.trim();
            const newBio = document.getElementById('bio-input').value.trim();
            const newAvatar = document.getElementById('current-avatar').innerText;
            if (!newName) return alert("이름을 입력해주세요.");
            window.stats.nickname = newName;
            window.stats.bio = newBio || "글로벌 미식가";
            window.stats.avatar = newAvatar;
            save();
            if (window.updateProfileOnServer) await window.updateProfileOnServer();
            alert("저장되었습니다.");
        };

        function adminAllAchievements() { 
            window.stats.achievements = achievements.map(a => a.id); 
            window.stats.collected = [...menus, ...legendMenus]; 
            window.stats.categories = ['k','c','j','w']; 
            save(); checkMaster(); updateSidebarProgress(); updateStatsLock(); 
            if(window.pushSpinToServer) window.pushSpinToServer(); 
            alert('전체 해금됨'); openModal('admin'); 
        }
        function adminResetAchievements() { 
            window.stats.achievements = []; window.stats.collected = []; window.stats.total = 0; window.stats.counts = {}; window.stats.categories = []; 
            save(); checkMaster(); updateSidebarProgress(); updateStatsLock(); 
            if(window.pushSpinToServer) window.pushSpinToServer(); 
            alert('초기화됨'); openModal('admin'); 
        }
        
        async function shareNow() {
            if (!window.stats.lastMenu) return;
            const btn = document.getElementById('share-btn'); btn.innerText = '생성 중...';
            let targetElement = document.getElementById('main-card');
            if (window.stats.useReceipt) {
                const now = new Date();
                document.getElementById('rec-date').innerText = now.toLocaleDateString();
                document.getElementById('rec-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('rec-menu').innerText = window.stats.lastMenu;
                let finalComment = (window.stats.lastMenu === "꽝") ? "오늘은 다이어트인가요?" : (window.stats.customDescriptions[window.stats.lastMenu] || (menuData[window.stats.lastMenu] ? menuData[window.stats.lastMenu][0] : "특별한 한 끼!"));
                document.getElementById('rec-comment').innerText = finalComment;
                document.getElementById('rec-id').innerText = (window.stats.avatar + " " + window.stats.nickname);
                document.getElementById('rec-total').innerText = window.stats.total;
                targetElement = document.getElementById('receipt-capture');
            }
            try {
                const canvas = await html2canvas(targetElement, { backgroundColor: window.stats.useReceipt ? '#ffffff' : (window.stats.darkMode ? '#1c1c1e' : '#f5f5f7'), scale: 2 });
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'bob_receipt.png', { type: 'image/png' });
                    if (navigator.share) await navigator.share({ files: [file], title: '오늘의 메뉴' });
                    else { const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'bob_receipt.png'; link.click(); }
                    if (window.stats.useReceipt) { window.stats.receiptShareCount = (window.stats.receiptShareCount || 0) + 1; checkAchievements(); save(); }
                });
            } finally { btn.innerText = '공유하기'; }
        }
        function addCustom() {
            const input = document.getElementById('custom-input'); const val = input.value.trim(); if (!val) return;
            let [mName, mDesc] = val.split(',').map(s => s.trim());
            if (mName && !window.stats.customMenus.includes(mName)) { window.stats.customMenus.push(mName); if(mDesc) window.stats.customDescriptions[mName] = mDesc; save(); openModal('settings'); init(); }
            input.value = '';
        }
        function removeCustom(m) { window.stats.customMenus = window.stats.customMenus.filter(x => x !== m); delete window.stats.customDescriptions[m]; save(); openModal('settings'); init(); }
        function closeModal() { document.getElementById('main-modal').style.transform = 'translateY(100%)'; setTimeout(() => { document.getElementById('modal-overlay').style.display = 'none'; }, 400); }
        function toggleDarkMode() { window.stats.darkMode = !window.stats.darkMode; document.body.classList.toggle('dark-mode'); save(); }
        function processToastQueue() { if (isToastShowing || toastQueue.length === 0) return; isToastShowing = true; const t = document.getElementById('toast'); t.innerText = toastQueue.shift(); t.style.top = '30px'; setTimeout(() => { t.style.top = '-100px'; setTimeout(() => { isToastShowing = false; processToastQueue(); }, 600); }, 3000); }
        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(window.stats)); }
        function checkStreak() { const today = new Date().toDateString(); if (window.stats.lastVisit === today) return; const yest = new Date(); yest.setDate(yest.getDate() - 1); window.stats.streak = (window.stats.lastVisit === yest.toDateString()) ? window.stats.streak + 1 : 1; window.stats.lastVisit = today; save(); }
        function setupBottomSheet() { const modalContent = document.getElementById('main-modal'); const dragZone = document.getElementById('dragZone'); let startY = 0; let currentY = 0; dragZone.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; modalContent.style.transition = 'none'; }); dragZone.addEventListener('touchmove', (e) => { currentY = e.touches[0].clientY - startY; if (currentY > 0) modalContent.style.transform = `translateY(${currentY}px)`; }); dragZone.addEventListener('touchend', () => { modalContent.style.transition = 'transform 0.4s cubic-bezier(0.15, 0, 0.15, 1)'; if (currentY > 150) closeModal(); else modalContent.style.transform = 'translateY(0)'; currentY = 0; }); }

        init();
    </script>
</body>
</html>
